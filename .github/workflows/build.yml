name: Gerar Executavel Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 🔒 TRAVA DE QUALIDADE: Se qualquer teste falhar aqui, o workflow para
      # imediatamente com erro (❌) e o Xadrez.exe NÃO é gerado!
      - name: Executar Testes Automatizados (Trava de Qualidade)
        run: |
          dotnet test ./tests/Xadrez.Tests/Xadrez.Tests.csproj --configuration Release --verbosity normal

      - name: Compilar Xadrez.exe (Arquivo Unico)
        run: |
          dotnet publish Xadrez.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./entrega

      - name: Copiar suas imagens (client/assets) e baixar Stockfish 16.1
        shell: pwsh
        run: |
          Copy-Item -Path "./client/assets" -Destination "./entrega/assets" -Recurse -Force

          try {
            $url = "https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-windows-x86-64-avx2.zip"
            Invoke-WebRequest -Uri $url -OutFile "sf.zip"
            Expand-Archive -Path "sf.zip" -DestinationPath "./sf_temp" -Force
            $sfExe = Get-ChildItem -Path "./sf_temp" -Filter "*.exe" -Recurse | Select-Object -First 1
            if ($sfExe) {
              Copy-Item $sfExe.FullName -Destination "./entrega/stockfish.exe" -Force
              Write-Host "Stockfish copiado com sucesso!"
            }
          } catch {
            Write-Host "Aviso: Usando Engine Tatica Posicional Interna."
          }

      - name: Disponibilizar .exe para Download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Xadrez-Windows-Exe
          path: ./entrega/